<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青空エディタ</title>
<style>
    body {
        margin: 0;
        background: #fff;
        color: #333;
        font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    }
    /* 設定部分 */
    #settings {
        position: sticky;
        top: 0;
        background: #fff;
        border-bottom: 1px solid #ccc;
        padding: 10px 15px;
        z-index: 10;
        font-size: 14px;
    }
    #settings label {
        margin-right: 12px;
        white-space: nowrap;
    }
    #settings .group {
        display: inline-block;
        margin-right: 20px;
        margin-bottom: 5px;
    }
    #settings button {
        margin-right: 5px;
        padding: 4px 12px;
        cursor: pointer;
    }
    /* 操作ボタン */
    #buttons {
        display: inline-block;
        margin-top: 3px;
    }
    #buttons button {
        font-size: 14px;
        padding: 5px 12px;
    }
    /* 本文 */
    #text {
        max-width: 900px;
        margin: 30px auto;
        padding: 0 25px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 18px;
        line-height: 1.8;
        outline: none;
    }
    /* マーク */
    .marked {
      background: #ffff66;
    }
    #markedList {
      max-width: 900px;
      margin: 10px auto;
      padding: 10px 25px;
      display: none;
    }
    #markedList button {
      margin: 3px;
      padding: 5px 10px;
      font-size: 16px;
    }
    .replaced {
        background-color: #ffff80;
    }
    .list-replaced {
        background-color: #b6e3b6;
    }
    /* フォント */
    #text.gothic {
        font-family: "Yu Gothic", "Meiryo", sans-serif;
    }
    #text.mincho {
        font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    }
    @font-face {
        font-family: "みかちゃん";
        src: url("mikachan.ttf") format("truetype");
    }
    #text.mika {
        font-family: "みかちゃん";
    }
    /* 行間 */
    #text.line-narrow {
        line-height: 1.4;
    }
    #text.line-normal {
        line-height: 1.8;
    }
    #text.line-middle {
        line-height: 2.2;
    }
    /* エラー表示 */
    #error {
        color: #c00;
        margin: 30px;
    }
    /* 変換中 */
    .loading {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 20px;
        font-size: 16px;
    }
    .spinner {
        display: inline-block;
        width: 24px;
        height: 24px;
        vertical-align: middle;
        border: 3px solid #ddd;
        border-top-color: #666;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
    /* 設定 */
    #speechSettings {
        display: none;
        margin-top: 10px;
        padding: 12px;
        border: 1px solid #ccc;
        background: #f8f8f8;
    }
    #speechSettings > div {
        margin-bottom: 8px;
    }
    #speechSettings select {
        min-width: 220px;
    }
    #speechSettings input[type="range"] {
        width: 500px;
    }
    #speechSettings button {
        margin-top: 5px;
    }
    /* スライダー設定 */
    #progressArea {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
    }
    #speechProgress {
        flex: 1;
    }
    #speechProgressValue {
        min-width: 4em;
        text-align: right;
    }
    /* 読み上げモード */
    #readingModeButtons {
        display: none;
        margin-top: 3px;
    }
    #readingModeButtons button {
        font-size: 16px;
        padding: 6px 14px;
        margin-right: 5px;
    }
</style>
</head>
<body>
<div id="settings">
    <div class="group">
        <strong>青空エディタ試験中</strong><br>
        <div id="toolLinks">
            <a href="http://pansy.s1010.xrea.com/aozora_search/index.html">
                青空サーチ
            </a>
            |
            <a href="http://pansy.s1010.xrea.com/aozora_search/ao_fulltext.html">

    </div>
    <div id="buttons">
        <button id="undoButton">↶ UNDO</button>
        <button id="redoButton">↷ REDO</button>
        <button id="saveButton">保存</button>
        <button id="saveAsButton">名前を付けて保存</button>
        <button id="loadButton">読み込み</button>
        <input type="file" id="loadFile" accept=".txt" style="display:none">
        <button id="convertButton">変換</button>
        <button id="restoreButton">原文に戻す</button>
        <button id="speakButton">読み上げ</button>
        <button id="markBtn">マーク</button>
        <button id="markedListBtn">マーク一覧</button>
        <button id="replaceBtn">置換</button>
        <button id="wordRegisterBtn">単語登録</button>
        <button id="listLoadBtn">リスト読み込み</button>
        <select id="sampleListSelect">
            <option value="">サンプルリスト</option>
            <option value="sample_list/堕落論_list.txt">堕落論</option>
            <option value="sample_list/実験室の思い出_list.txt">実験室の思い出</option>
        </select>
        <button id="listCheckBtn">リスト確認</button>
        <button id="listReplaceBtn">リスト置換</button>
        <button id="listSaveBtn">リスト保存</button>
        <input type="file" id="listFile" accept=".txt" style="display:none">
        <button id="settingsButton">設定</button>
    </div>
    <div id="readingModeButtons">
        <button id="readingStopButton">停止</button>
        <button id="readingRewindButton">↶ 巻き戻し</button>
        <button id="readingReplaceButton">置換</button>
        <button id="readingExitButton">通常モードへ戻る</button>
        <span id="wakeLockStatus" role="status" aria-live="polite"></span>
    </div>
    <!-- 変換中表示 -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <span>ただいま変換中…</span>
    </div>
    <div id="speechSettings">
        <div>
            <strong>フォント：</strong>
            <label>
                <input type="radio" name="font" value="gothic">
                ゴシック
            </label>
            <label>
                <input type="radio" name="font" value="mincho" checked>
                明朝
            </label>
            <label>
                <input type="radio" name="font" value="mika">
                みかちゃん
            </label>
        </div>
        <div>
            <strong>行間：</strong>
            <label>
                <input type="radio" name="line" value="line-narrow">
                狭い
            </label>
            <label>
                <input type="radio" name="line" value="line-normal" checked>
                普通
            </label>
            <label>
                <input type="radio" name="line" value="line-middle">
                広い
            </label>
        </div>
        <div>
            <strong>ルビ：</strong>
            <label>
                <input type="radio" name="ruby" value="keep">
                保持
            </label>
            <label>
                <input type="radio" name="ruby" value="remove" checked>
                除去
            </label>
            <label>
                <input type="radio" name="ruby" value="expand">
                展開
            </label>
        </div>
        <div class="group">
            <strong>変換１：</strong>
            <label>
                <input type="checkbox" id="removeNotes" checked>
                注釈除去
            </label>
            <label>
                <input type="checkbox" id="convertKanjiNumber">
                漢数字変換
            </label>
        </div>
        <div>
            <strong>変換２：</strong>
            <label>
                <input type="radio" name="conversion" value="none" checked>
                変換しない
            </label>
            <label>
                <input type="radio" name="conversion" value="simple">
                簡易変換
            </label>
            <label>
                <input type="radio" name="conversion" value="kyuuji">
                旧字変換
            </label>
            <label>
                <input type="radio" name="conversion" value="aozora" id="aozoraConversion">
                青空変換（PCのみ）
            </label>
        </div>
        <div>
            <label>
                読み上げ音声：
                <select id="voiceSelect"></select>
            </label>
        </div>
        <div>
            <label>
                読む速さ：
                <input type="range" id="speechRate"
                       min="0.5" max="4.0" step="0.05" value="2.1">
                <span id="speechRateValue">2.10</span>
            </label>
        </div>
        <div>
            <label>
                声の高さ：
                <input type="range" id="speechPitch"
                       min="0.5" max="4.0" step="0.05" value="1.0">
                <span id="speechPitchValue">1.00</span>
            </label>
        </div>
        <div>
            <label>
                <input type="checkbox" id="preventSleep" checked>
                スリープ防止
            </label>
        </div>
        <button id="saveSettings">設定を保存</button>
        <button id="closeSettings">閉じる</button>
    </div>
    <div id="progressArea">
        <input
            type="range"
            id="speechProgress"
            min="0"
            max="100"
            step="0.1"
            value="0"
        >
        <span id="speechProgressValue">0%</span>
    </div>
</div>
<!-- 置換ダイアログ -->

<!-- 置換リスト確認 -->
<div id="listCheckDialog" style="
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.3);
    align-items:center;
    justify-content:center;
    z-index:1000;
">
    <div style="
        background:white;
        padding:20px;
        width:95%;
        max-width:800px;
        max-height:90vh;
        box-sizing:border-box;

        display:flex;

    ">
        <div id="listCheckFileName"
             style="margin-bottom:10px; font-weight:bold;">

        <div style="
            overflow:auto;

        ">

            <h4 style="margin:15px 0 5px;">fオプション（ルビ）</h4>

<div id="error"></div>
<div id="rubyStatus"></div>
<div id="markedList"></div>
<div id="text" contenteditable="true">読み込み中……</div>
<script src="browser.umd.js"></script>
<script>
    // =========================================
    // Ruby / WASM
    // =========================================
    let rubyVM = null;
    let rubyReady = false;
    let replaceReady = false;
    let rubyInitPromise = null;
    let converting = false;
    // =========================================
    // Ruby / WASM本体を起動
    // =========================================
    async function initRuby() {
        try {
            const {
                DefaultRubyVM
            } = window["ruby-wasm-wasi"];
            // ruby.wasmを取得
            const response = await fetch("ruby+stdlib.wasm");
            if (!response.ok) {
                throw new Error(
                    "ruby.wasmを読み込めませんでした。"
                );
            }
            const buffer =
                await response.arrayBuffer();
            const module =
                await WebAssembly.compile(buffer);
            const result =
                await DefaultRubyVM(module);
            rubyVM = result.vm;
            // 常時使用するデータを読み込む
            // data01.rb = 旧字変換
            const baseFiles = [
                "data01.rb"
            ];
            for (const file of baseFiles) {
                const response =
                    await fetch(file);
                if (!response.ok) {
                    throw new Error(
                        file +
                        "を読み込めませんでした。"
                    );
                }
                const code =
                    await response.text();
                console.log(
                    file + ":",
                    code.length
                );
                rubyVM.eval(code);
            }
            // ao_edit.rbは処理だけを定義するので常時読み込む
            const rubyResponse =
                await fetch("ao_edit.rb");
            if (!rubyResponse.ok) {
                throw new Error(
                    "ao_edit.rbを読み込めませんでした。"
                );
            }
            const edit =
                await rubyResponse.text();
            console.log(
                "ao_edit.rb:",
                edit.length
            );
            rubyVM.eval(edit);
            rubyReady = true;
            console.log("Rubyの準備ができました。");
        } catch (error) {
            console.error(error);
            document.getElementById("error").textContent =
                "Rubyの初期化に失敗しました：" +
                error.message;
            throw error;
        }
    }
    // =========================================
    // 青空変換用データ読み込み
    // =========================================
    async function loadReplaceData() {
        if (replaceReady) {
            return;
        }
        const rubyStatus = document.getElementById("rubyStatus");
        rubyStatus.innerHTML =
            '<span class="spinner"></span> ① 置換データを読み込み中……';
        // ①をブラウザに一度描画させる
        await new Promise(resolve =>
            requestAnimationFrame(resolve)
        );
        try {
            const dataFiles = [
                "data02.rb"
            ];
            await rubyInitPromise;
            for (const file of dataFiles) {
                const response = await fetch(file);
                if (!response.ok) {
                    throw new Error(
                        file +
                        "を読み込めませんでした。"
                    );
                }
                const code = await response.text();
                rubyStatus.innerHTML =
                    '<span class="spinner"></span> ② 置換データを展開中……';
                await new Promise(resolve =>
                  requestAnimationFrame(() => {
                    requestAnimationFrame(resolve);
                  })
                );
                rubyVM.eval(code);
                rubyVM.eval("HAS,TRI,REP02=DATA2");
            }
            replaceReady = true;
            rubyStatus.textContent = "";
            console.log(
                "青空変換用置換リストの準備ができました。"
            );
        } catch (error) {
            console.error(error);
            rubyStatus.textContent = "";
            errorElement.textContent =
                "置換リストの読み込みに失敗しました：" +
                error.message;
            throw error;
        }
    }
    // Ruby本体を起動
    rubyInitPromise = initRuby();
    // URLの ?file= からTXTファイル名を取得
    const params = new URLSearchParams(location.search);
    const file = params.get("file");
    const textElement =
        document.getElementById("text");
    const errorElement =
        document.getElementById("error");
    const loadingElement =
        document.getElementById("loading");
    // =========================================
    // 自動保存
    // =========================================
    let autoSaveTimer = null;
    // この作品専用の保存場所を作る
    let autoSaveKey =
        "aoEditorAutoSave:" +
        (file || "local");
    // 編集状態を自動保存
    function autoSaveText() {
        const html = textElement.innerHTML;
        if (!html) {
            return;
        }
        try {
            localStorage.setItem(
                autoSaveKey,
                JSON.stringify({
                    html: html,
                    chikanList: chikanList,
                    time: Date.now()
                })
            );
        } catch (error) {
            console.error(
                "自動保存に失敗しました：",
                error
            );
        }
    }
    // 文章を変更したら2秒後に自動保存
    textElement.addEventListener("input", function() {
        saveHistory();
        updateUndoRedoButtons();
        clearTimeout(autoSaveTimer);
        autoSaveTimer = setTimeout(
            autoSaveText,
            2000
        );
    });
    // 自動保存されていれば復元する
    function checkAutoSave() {
        const saved =
            localStorage.getItem(autoSaveKey);
        if (!saved) {
            return;
        }
        try {
            const data = JSON.parse(saved);
            if (!data.html) {
                return;
            }
            const date =
                new Date(data.time);
            const message =
                "前回の編集中データがあります。\n\n" +
                date.toLocaleString() +
                "\n\n" +
                "この文章を復元しますか？";
            if (confirm(message)) {
                textElement.innerHTML =
                    data.html;
                chikanList =
                    data.chikanList || [];
                originalText =
                    textElement.textContent;
            }
        } catch (error) {
            console.error(
                "自動保存データの読み込みに失敗しました：",
                error
            );
        }
    }
    // =========================================
    // 置換リスト
    // =========================================
    let chikanList = [];
    let chikanFileName = "堕落論_list.txt";    let originalText = "";
    // =========================================
    // UNDO / REDO
    // =========================================
    const undoStack = [];
    const redoStack = [];
    const maxHistory = 20;
    function getEditorState() {
        return {
            html: textElement.innerHTML,
            chikanList: JSON.parse(
                JSON.stringify(chikanList)
            )
        };
    }
    function restoreEditorState(state) {
        textElement.innerHTML = state.html;
        chikanList = JSON.parse(
            JSON.stringify(state.chikanList)
        );
    }
    function saveHistory() {
        const state = getEditorState();
        const last =
            undoStack[undoStack.length - 1];
        // 同じ状態なら記録しない
        if (last &&
            last.html === state.html &&
            JSON.stringify(last.chikanList) ===
                JSON.stringify(state.chikanList)) {
            return;
        }
        undoStack.push(state);
        if (undoStack.length > maxHistory) {
            undoStack.shift();
        }
        redoStack.length = 0;
    }
    function updateUndoRedoButtons() {
        document.getElementById("undoButton").disabled =
            undoStack.length <= 1;
        document.getElementById("redoButton").disabled =
            redoStack.length === 0;
    }
    // 原文を保持
    // =========================================
    // TXTを読み込む
    // =========================================
    if (!file) {
        textElement.textContent = "";
        errorElement.textContent =
            "TXTファイルが指定されていません。";
    } else {
        fetch(file)
            .then(response => {
                if (!response.ok) {
                    throw new Error(
                        "TXTファイルを読み込めませんでした。"
                    );
                }
                return response.text();
            })
            .then(text => {
                originalText = text;
                textElement.textContent = text;
                // 自動保存データがあれば確認
                checkAutoSave();
                undoStack.length = 0;
                redoStack.length = 0;
                undoStack.push(getEditorState());
                updateUndoRedoButtons();
            })
            .catch(error => {
                textElement.textContent = "";
                errorElement.textContent =
                    error.message;
            });
    }
    // =========================================
    // フォント変更
    // =========================================
    document
        .querySelectorAll('input[name="font"]')
        .forEach(radio => {
            radio.addEventListener("change", function() {
                textElement.classList.remove(
                    "gothic",
                    "mincho",
                    "mika"
                );
                textElement.classList.add(
                    this.value
                );
            });
        });
    // =========================================
    // 行間変更
    // =========================================
    document
        .querySelectorAll('input[name="line"]')
        .forEach(radio => {
            radio.addEventListener("change", function() {
                textElement.classList.remove(
                    "line-narrow",
                    "line-normal",
                    "line-middle"
                );
                textElement.classList.add(
                    this.value
                );
            });
        });
    // =========================================
    // 変換
    // =========================================
    document
        .getElementById("convertButton")
        .addEventListener("click", async function() {
        if (converting) {
            return;
        }
        converting = true;
        const convertButton = document.getElementById("convertButton");
        convertButton.disabled = true;
            // Ruby / WASMの準備を待つ
            try {
                await rubyInitPromise;
            } catch (error) {
                converting = false;
                convertButton.disabled = false;
                return;
            }
            // 現在表示されている本文から処理する
            let text = textElement.textContent;
            // ---------------------------------
            // 注釈除去
            // ---------------------------------
            if (
                document
                    .getElementById("removeNotes")
                    .checked
            ) {

    function replaceAndMark(before, after) {
        if (before === "") {
            return 0;
        }
        const walker = document.createTreeWalker(
            textElement,
            NodeFilter.SHOW_TEXT
        );
        const nodes = [];
        let node;
        while (node = walker.nextNode()) {
            nodes.push(node);
        }
        let count = 0;
        nodes.forEach(function(node) {
            if (!node.nodeValue.includes(before)) {
                return;
            }
            const parent = node.parentElement;
            if (parent && parent.closest(".replaced")) {
                return;
            }
            const parts = node.nodeValue.split(before);
            if (parts.length === 1) {
                return;
            }
            const fragment = document.createDocumentFragment();
            parts.forEach(function(part, i) {
                if (i > 0) {
                    const span = document.createElement("span");
                    span.className = "replaced";
                    span.textContent = after;
                    fragment.appendChild(span);
                    count++;
                }
                if (part !== "") {
                    fragment.appendChild(
                        document.createTextNode(part)
                    );
                }
            });
            node.parentNode.replaceChild(fragment, node);
        });
        return count;
    }

        // =========================================

        function loadChikanListText(text, fileName) {
            const lines = text.split(/\r?\n/);
            chikanList = [];
            lines.forEach(function(line) {
                if (!line.trim()) {
                    return;
                }
                const fields = line.split(",");
                fields[0] = fields[0].replace(/^\uFEFF/, "");
                if (fields.length < 2) {
                    return;
                }
                const row = [
                    fields[0],
                    fields[1]
                ];
                if (fields.length >= 3 &&
                    fields[2] !== "") {
                    row.push(fields[2]);
                }
                if (fields.length >= 4 &&
                    fields[3] !== "") {
                    row.push(fields[3]);
                }
                chikanList.push(row);
            });
            chikanFileName = fileName;
            alert(
                chikanFileName +
                "を読み込みました。\n" +
                chikanList.length +
                "件"
            );

    // HTTPSでない場合の代替策。ユーザー操作中に無音の動画を再生する。
    // Androidブラウザで動画再生中の画面消灯を抑える仕組みを利用する。
    function startSleepVideo() {
        if (!sleepVideo) {
            if (!HTMLCanvasElement.prototype.captureStream) {
                return Promise.reject(
                    new Error("このブラウザは動画フォールバックに対応していません。")
                );
            }
            const canvas = document.createElement("canvas");
            canvas.width = 2;
            canvas.height = 2;
            const context = canvas.getContext("2d");
            context.fillStyle = "black";
            context.fillRect(0, 0, canvas.width, canvas.height);
            sleepVideoStream = canvas.captureStream(1);

            sleepVideo = document.createElement("video");
            sleepVideo.muted = true;
            sleepVideo.playsInline = true;
            sleepVideo.setAttribute("playsinline", "");
            sleepVideo.setAttribute("aria-hidden", "true");
            sleepVideo.tabIndex = -1;
            sleepVideo.disablePictureInPicture = true;
            sleepVideo.srcObject = sleepVideoStream;
            sleepVideo.style.cssText =
                "position:fixed;width:1px;height:1px;left:0;bottom:0;" +
                "opacity:0.01;pointer-events:none;z-index:0;";
            document.body.appendChild(sleepVideo);
        }
        // この関数は読み上げボタン／再生ボタンの操作から呼び出し、
        // モバイルブラウザのユーザー操作要件を満たす。
        return sleepVideo.play();
    }

            sleepVideoStream.getTracks().forEach(function(track) {

        }

    async function requestWakeLock() {
        const status = document.getElementById("wakeLockStatus");
        if (
            !speaking ||
            !document.getElementById("preventSleep").checked ||
            document.visibilityState !== "visible"
        ) {
            return;
        }
        if (!("wakeLock" in navigator)) {
            try {
                await startSleepVideo();
                status.textContent = "動画によるスリープ防止中";
            } catch (err) {
                console.log("動画フォールバックの開始失敗:", err);
                status.textContent = "動画によるスリープ防止を開始できません。";
            }
            return;
        }
        if (wakeLock && !wakeLock.released) {
            return;
        }
        if (wakeLockRequest) {
            return wakeLockRequest;
        }
        try {
            wakeLockRequest = navigator.wakeLock.request("screen");
            const requestedLock = await wakeLockRequest;
            // 取得待ちの間に停止・非表示・設定変更された場合は保持しない
            if (
                !speaking ||
                !document.getElementById("preventSleep").checked ||
                document.visibilityState !== "visible"
            ) {
                await requestedLock.release();
                return;
            }
            wakeLock = requestedLock;
            status.textContent = "スリープ防止中";
            requestedLock.addEventListener("release", function() {
                if (wakeLock === requestedLock) {
                    wakeLock = null;
                    if (
                        speaking &&
                        document.visibilityState === "visible" &&
                        document.getElementById("preventSleep").checked
                    ) {
                        status.textContent = "スリープ防止を再取得しています…";
                        scheduleWakeLockRetry();
                    }
                }
            });
            console.log("Wake Lock取得");
        } catch (err) {
            console.log("Wake Lock取得失敗:", err);
            // APIが拒否された場合も、ユーザー操作からの代替再生を試す
            try {
                await startSleepVideo();
                status.textContent = "動画によるスリープ防止中";
            } catch (fallbackError) {
                console.log("動画フォールバックの開始失敗:", fallbackError);
                status.textContent = "スリープ防止を取得できません。HTTPS接続をお試しください。";
                scheduleWakeLockRetry();

        } finally {
            wakeLockRequest = null;
        }
    }

    // 文字位置 start ～ end を実際に選択する
    function selectText(start, end) {
        const sel = window.getSelection();
        const range = document.createRange();
        const walker = document.createTreeWalker(
            textElement,
            NodeFilter.SHOW_TEXT
        );
        let node;
        let pos = 0;
        let startNode = null;
        let startOffset = 0;
        let endNode = null;
        let endOffset = 0;
        while (node = walker.nextNode()) {
            const nextPos = pos + node.nodeValue.length;
            if (!startNode && start >= pos && start <= nextPos) {
                startNode = node;
                startOffset = start - pos;
            }
            if (end >= pos && end <= nextPos) {
                endNode = node;
                endOffset = end - pos;
                break;
            }
            pos = nextPos;
        }
        if (!startNode || !endNode) {
            return false;
        }
        range.setStart(startNode, startOffset);
        range.setEnd(endNode, endOffset);
        sel.removeAllRanges();
        sel.addRange(range);
        return true;
    }
    // 次の一文を読み上げる
    function speakNext(start) {
        const text = textElement.textContent;
        // 現在のセッション番号を取得
        const session = speechSession;
        // 現在読み上げている文章の先頭を保存
        currentSpeechStart = start;
        // 現在位置を保存
        speechPosition = start;
        updateSpeechProgress(start);
        // 最後まで来た
        if (start >= text.length) {
            speaking = false;
            readingStopButton.textContent = "再生";
            releaseWakeLock();
            return;
        }
        // 次の区切り文字を探す
        let match = text.slice(start).match(
            /。|！|？|――。?|……。?|\n/
        );
        let end;
        if (match) {
            end = start + match.index + match[0].length;
        } else {
            end = text.length;
        }
        // 一文を取り出す
        const sentence = text.slice(start, end);
        // 空白だけなら次へ
        if (!sentence.trim()) {
            speakNext(end);
            return;
        }
        // 一文を選択
        if (!selectText(start, end)) {
            speaking = false;
            readingStopButton.textContent = "再生";
            releaseWakeLock();
            return;
        }
        // 選択箇所を画面中央付近へ
        const selection = window.getSelection();
        if (selection.rangeCount > 0) {
            const rect =
                selection.getRangeAt(0).getBoundingClientRect();
            if (
                rect.top < 150 ||
                rect.bottom > window.innerHeight - 150
            ) {
                window.scrollBy({
                    top: rect.top - window.innerHeight / 2,
                    behavior: "smooth"
                });
            }
        }
        // 読み上げ
        const utterance =
            new SpeechSynthesisUtterance(sentence);
        utterance.lang = "ja-JP";
        utterance.rate =
            Number(
                document.getElementById("speechRate").value
            );
        utterance.pitch =
            Number(
                document.getElementById("speechPitch").value
            );

            if (session !== speechSession) {
                return;

            if (speaking) {
                speakNext(end);
            } else {
                releaseWakeLock();
            }
        };
        speechSynthesis.speak(utterance);
    }

        const re =
            /。|！|？|――。?|……。?|\n/g;
        let previousStart = 0;
        let match;
        while ((match = re.exec(text)) !== null) {
            const end =
                match.index + match[0].length;
            if (end >= pos) {
                break;

            previousStart = end;

                file.name;
            originalText = reader.result;
            textElement.textContent = reader.result;
            checkAutoSave();
            undoStack.length = 0;
            redoStack.length = 0;
            undoStack.push(getEditorState());
            updateUndoRedoButtons();
        };
        reader.readAsText(file, "UTF-8");
        // 同じファイルをもう一度選べるようにする
        this.value = "";
    });
</script>
</body>
</html>
